services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tasksdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasksdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db

  ai-service:
    build: ./ai-service
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    ports: ["127.0.0.1:8083:8083"]

  auth-service:
    build: ./auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tasksdb
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-123456}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:8084:8084"]

  note-service:
    build: ./note-service
    environment:
      MONGO_URI: mongodb://mongo:27017/notesdb
      AI_SERVICE_URL: http://ai-service:8083
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-123456}
    depends_on: [mongo, ai-service]
    ports: ["127.0.0.1:8081:8081"]

  task-service:
    build: ./task-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tasksdb
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-123456}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:8082:8082"]

  web:
    build: ./frontend
    depends_on: [auth-service, note-service, task-service]
    ports: ["8080:80"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]

  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    ports: ["127.0.0.1:3100:3100"]

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus, loki]
    ports: ["3000:3000"]

volumes:
  pgdata:
  mongodata:
  lokidata:
  grafanadata:
