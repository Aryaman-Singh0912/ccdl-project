name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, note-service, task-service, ai-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Build and test
        run: mvn -B verify
        working-directory: ${{ matrix.service }}
      - name: Build Docker image
        run: docker build -t ${{ matrix.service }}:ci ${{ matrix.service }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build
        run: npm install && npm run build
        working-directory: frontend
      - name: Build Docker image
        run: docker build -t frontend:ci frontend
