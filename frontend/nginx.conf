server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's built-in DNS, so nginx still starts if a service is briefly down.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/auth/ {
    set $upstream http://auth-service:8084;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/notes {
    set $upstream http://note-service:8081;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  location /api/tasks {
    set $upstream http://task-service:8082;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
