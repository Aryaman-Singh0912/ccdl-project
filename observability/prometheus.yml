global:
  scrape_interval: 10s
scrape_configs:
  - job_name: note-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['note-service:8081']
  - job_name: task-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['task-service:8082']
  - job_name: ai-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ai-service:8083']
